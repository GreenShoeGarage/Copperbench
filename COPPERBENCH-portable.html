## Adafruit BME280 Breakout PCB

<a href="http://www.adafruit.com/products/2652"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

PCB files for the Adafruit BME280 Breakout. Format is EagleCAD schematic and board layout
* https://www.adafruit.com/product/2652

### Description

Bosch has stepped up their game with their new BME280 sensor, an environmental sensor with temperature, barometric pressure and humidity! This sensor is great for all sorts of weather/environmental sensing and can even be used in both I2C and SPI!

This precision sensor from Bosch is the best low-cost sensing solution for measuring humidity with ±3% accuracy, barometric pressure with ±1 hPa absolute accuraccy, and temperature with ±1.0°C accuracy. Because pressure changes with altitude, and the pressure measurements are so good, you can also use it as an altimeter with  ±1 meter or better accuracy!

The BME280 is the next-generation of sensors from Bosch, and is the upgrade to the BMP085/BMP180/BMP183 - with a low altitude noise of 0.25m and the same fast conversion time. It has the same specifications, but can use either I2C or SPI. For simple easy wiring, go with I2C. If you want to connect a bunch of sensors without worrying about I2C address collisions, go with SPI.

## Adafruit DS3231 Precision RTC Breakout PCB
<a href="http://www.adafruit.com/products/5188"><img src="assets/5188.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a><br/>
<a href="http://www.adafruit.com/products/3013"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

The datasheet for the DS3231 explains that this part is an "Extremely Accurate I²C-Integrated RTC/TCXO/Crystal". And, hey, it does exactly what it says on the tin! This Real Time Clock (RTC) is the most precise you can get in a small, low power package.

Most RTCs use an external 32kHz timing crystal that is used to keep time with low current draw. And that's all well and good, but those crystals have slight drift, particularly when the temperature changes (the temperature changes the oscillation frequency very very very slightly but it does add up!) This RTC is in a beefy package because the crystal is inside the chip! And right next to the integrated crystal is a temperature sensor. That sensor compensates for the frequency changes by adding or removing clock ticks so that the timekeeping stays on schedule.

This is the finest RTC you can get, and now we have it in a compact, breadboard-friendly breakout. With a coin cell plugged into the back, you can get years of precision timekeeping, even when main power is lost. Great for datalogging and clocks, or anything where you need to really know the time.

PCB files for the Adafruit DS3231 Precision RTC Breakout. The format is EagleCAD schematic and board layout

## Adafruit TB6612 Motor Driver Breakout PCB

<a href="http://www.adafruit.com/products/2448"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

PCB files for the Adafruit TB6612 Motor Driver Breakout. Format is EagleCAD schematic and board layout
* https://www.adafruit.com/product/2448

### DESCRIPTION
Spin two DC motors, step one bi-polar or uni-polar stepper, or fire off two solenoids with 1.2A per channel using the TB6612. These are perhaps better known as "the drivers in our assembled Adafruit Motorshield or Motor HAT." We really like these dual H-bridges, so if you want to control motors without a shield or HAT these are easy to include on any solderless breadboard or perma-proto.

We solder on TB6612 onto a breakout board for you here, with a polarity protection FET on the motor voltage input and a pullup on the "standby" enable pin. Each breakout chip contains two full H-bridges (four half H-bridges). That means you can drive 2-4 solenoids (only two can be active at a time, on opposite bridges), two DC motors bi-directionally, or one stepper motor. Just make sure they're good for 1.2 Amp or less of current, since that's the limit of this chip. They do handle a peak of 3A but that's just for a short amount of time, like 20 milliseconds. What we like most about this particular driver is that it comes with built in kick-back diodes internally so you don't have to worry about the inductive kick damaging your project or driver!

There's two digital inputs per H-bridge (one for each half of the bridge) as well as a PWM input per driver so you can control motor speed. Runs at 2.7V-5V logic. The motor voltage is separate from the logic voltage. Good for motor voltages from 4.5V up to 13.5V! This wont work well for 3V motors.

## Adafruit 128x64 Monochrome OLED PCB
<a href="http://www.adafruit.com/products/326"><img src="assets/326.jpg?raw=true" width="500px"><br/>
<a href="http://www.adafruit.com/products/326"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

These displays are small, only about 1" diagonal, but very readable due to the high contrast of an OLED display. This display is made of 128x64 individual white OLED pixels, each one is turned on or off by the controller chip. Because the display makes its own light, no backlight is required. This reduces the power required to run the OLED and is why the display has such high contrast; we really like this miniature display for its crispness!

This breakout can be used with either an SPI or I2C interface - selectable by soldering two jumpers on the back. The design is completely 5V-ready, with an onboard regulator and built in boost converter. It's easier than ever to connect directly to your 3V or 5V microcontroller without needing any kind of level shifter!

This is the PCB for the Adafruit 128x64 I2C/SPI/Parallel OLED breakout board. The format is EagleCAD schematic and board layout
- http://www.adafruit.com/products/326

.library-shortcuts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:8px}
.library-shortcuts button{padding:7px 5px;font-size:11px;line-height:1.35;min-width:0}
.library-tools{font-size:11px;margin:6px 0 14px;border-bottom:1px solid var(--line)}
.library-tools summary{cursor:pointer;padding:6px 0 10px;color:var(--muted)}
.library-tools .button-row{margin:0 0 10px}.panel-title{margin:0 0 14px;font-size:17px}
.empty-inspector{padding:8px 0 20px}.empty-inspector h3{font-size:15px;font-weight:600}
.empty-inspector p{font-size:11px;color:var(--muted);margin-top:7px}
.check-summary{display:flex;flex-wrap:wrap;gap:12px;margin:9px 0 18px;font-size:11px;color:var(--muted)}
.check-summary .has-errors{color:var(--danger);font-weight:650}.layer-label{font-size:11px;color:var(--muted);margin:10px 0}
.board-stats{top:16px;right:16px;font-size:10px;line-height:1.6;max-width:calc(100% - 85px)}
.board-counts{display:block}.board-state{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end;margin-top:5px}
.board-state button{pointer-events:auto;font-size:10px;padding:4px 7px;background:var(--panel);border-color:var(--line);white-space:normal}
.board-state .plane-indicator{margin:0;max-width:210px}
.contextbar{min-height:40px}.contextbar .route-width{margin-left:auto}
#toolHint{flex:0 1 auto;min-width:0}.tool-help{flex:none;border:1px solid var(--line);padding:2px 6px;font-size:11px;border-radius:50%;background:transparent}
#viaPlacementStatus{min-height:0}.help-btn{min-width:25px}
@media(max-width:1180px){.brand h1{font-size:18px}.drawer-content{padding:12px}.contextbar{flex-wrap:wrap}.library-shortcuts button{font-size:10px}}
@media(max-width:950px){.inspector{top:108px}}
@media(max-width:700px){.app-header{height:58px}.brand h1{font-size:14px}.brand-mark{width:28px;height:32px}.drawer,.inspector{top:101px}.contextbar{min-height:42px;padding:6px 9px;gap:6px}.contextbar:has(#toolHint:not([hidden])){min-height:62px}#toolHint:not([hidden]){order:4;flex-basis:100%;font-size:10px}.contextbar .route-width{gap:5px}.board-stats{top:16px;right:10px;max-width:calc(100% - 64px)}.board-state .plane-indicator{max-width:140px}.board-state button{font-size:9px}.library-shortcuts button{font-size:11px}}
@media(max-width:390px){.brand h1{font-size:13px}}
/* Keep active controls legible on both dark canvases. */
[data-theme=dark] .tool-name,[data-theme=contrast] .tool-name,
[data-theme=dark] .drawer-tabs button.active,[data-theme=contrast] .drawer-tabs button.active,
[data-theme=dark] .camera-controls button.active,[data-theme=contrast] .camera-controls button.active{color:var(--ink)}
[data-theme=dark] .tool-rail button.active,[data-theme=contrast] .tool-rail button.active{color:#fff}
summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:3px}

.board-state .plane-indicator.has-warning{color:var(--danger);border-color:var(--danger);font-weight:600}

</style><script>window.CB_PORTABLE=true;</script>
</head>
<body>
<a href="#canvas" class="skip">Skip to the board</a>
<header class="app-header">
 <div class="brand" title="Green Shoe Garage · Field Instruments"><div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M10 8h20v24H10zM4 13h6m-6 7h6m-6 7h6m20-14h6m-6 7h6m-6 7h6"/><path d="M17 14h7v5h-7v7h7"/></svg></div><div><h1>COPPERBENCH <span class="version">v1.6.1</span></h1></div></div>
 <div class="header-actions"><span id="saveState" class="save-state" role="status"><i></i> Starting</span><button data-action="undo" title="Undo · ⌘/Ctrl Z" class="icon-button" aria-label="Undo">↶</button><button data-action="redo" title="Redo · ⌘/Ctrl Shift Z" class="icon-button" aria-label="Redo">↷</button><button data-action="files" class="mobile-files" aria-label="Project files" title="Project files">▤</button><button data-action="open" class="quiet">Open</button><button data-action="save" class="quiet">Save JSON</button><button data-action="export" class="primary">Export board <span aria-hidden="true">↗</span></button></div>
</header>
<div class="project-strip"><div class="project-title"><button data-action="toggle-drawer" class="mobile-button" aria-label="Open tools and parts">☰</button><span class="project-dot" aria-hidden="true"></span><button id="titleButton" data-action="rename">Little light · learning board</button><span id="projectDimensions" class="muted"></span></div><div class="strip-actions"><select id="modeSelect" aria-label="Interface detail"><option value="easy">Easy mode</option><option value="advanced">Advanced mode</option></select><button data-action="examples">Examples</button><button data-action="fresh">Fresh start</button><button data-action="help" class="help-btn" title="Guide and keyboard shortcuts" aria-label="Help and keyboard shortcuts">?</button><button data-action="theme" aria-label="Switch theme" title="Light, dark and high contrast themes">◐</button></div></div>
<main class="app-body">
 <aside id="drawer" class="drawer" aria-label="Parts and project tools">
  <nav class="drawer-tabs" aria-label="Project panels"><button class="active" data-panel="parts">Parts</button><button data-panel="nets">Nets</button><button data-panel="planes">Planes</button><button data-panel="board">Board</button><button data-panel="silk">Mark</button><button data-panel="records" title="Evidence and revisions">Log</button></nav>
  <div id="drawerContent" class="drawer-content"></div>
 </aside>
 <section class="workspace" aria-label="PCB workbench">
  <div class="viewbar"><div class="segmented" role="group" aria-label="Board view"><button data-view="bench" class="active">Bench <span>3D</span></button><button data-view="copper">Copper</button><button data-view="fabrication">Fabrication</button></div><div class="view-controls"><div class="side-switch"><button data-side="top" class="active">Top</button><button data-side="bottom">Bottom</button></div><button data-action="fit" title="Fit board · Home">Fit</button><button data-action="zoom-out" aria-label="Zoom out">−</button><button data-action="zoom-in" aria-label="Zoom in">+</button><button data-action="toggle-inspector" title="Show or hide inspector" aria-label="Toggle inspector">▥</button></div></div>
  <div class="stage" id="stage"><canvas id="canvas" tabindex="0" role="application" aria-label="Interactive PCB. Use the parts and nets tables for keyboard editing. Press H for help."></canvas>
   <div class="tool-rail" role="toolbar" aria-label="Board drawing tools">
    <button class="active" data-tool="select" title="Select and move · V" aria-label="Select and move"><svg viewBox="0 0 24 24"><path d="M5 3l14 10-7 1-3 7z"/></svg></button>
    <button data-tool="trace" title="Draw trace · T" aria-label="Draw a trace"><svg viewBox="0 0 24 24"><circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M5 16v-5l6-5h6"/></svg></button>
    <button data-tool="via" title="Place through via · Shift+V (V while tracing)" aria-label="Place a through via"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M1 12h3m16 0h3"/></svg></button>
    <button data-tool="connect" title="Pick leads to autowire · A" aria-label="Select leads for autowiring"><svg viewBox="0 0 24 24"><path d="M5 18V6h14v12H5zM9 12h6m-3-3v6"/><circle cx="5" cy="6" r="2"/><circle cx="19" cy="18" r="2"/></svg></button>
    <span class="tool-separator"></span>
    <button data-tool="hole" title="Place mounting hole · O" aria-label="Place a mounting hole"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><path d="M12 2v6m0 8v6M2 12h6m8 0h6"/></svg></button>
    <button data-tool="zone" title="Draw a copper zone · Z" aria-label="Draw copper zone"><svg viewBox="0 0 24 24"><path d="M4 4h12l4 4v12H4zM6 9l5-5M6 15L17 4M8 20L20 8M14 20l6-6"/></svg></button>
    <button data-tool="outline" title="Draw board outline · B" aria-label="Draw board outline"><svg viewBox="0 0 24 24"><path d="M4 5h10l6 6v8H4z"/><circle cx="4" cy="5" r="1.5"/><circle cx="20" cy="11" r="1.5"/></svg></button>
    <span class="tool-separator"></span>
    <button data-tool="text" title="Add silkscreen text · S" aria-label="Add silkscreen text"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v14M8 20h8M5 4v4m14-4v4"/></svg></button>
    <button data-tool="silk-line" title="Draw silkscreen line · L" aria-label="Draw silkscreen line"><svg viewBox="0 0 24 24"><path d="M4 20L20 4M4 16v4h4M16 4h4v4"/></svg></button>
    <button data-action="image" title="Convert image to silkscreen" aria-label="Import image as silkscreen"><svg viewBox="0 0 24 24"><path d="M4 4h16v16H4zM4 17l5-6 4 4 3-4 4 5"/><circle cx="15" cy="8" r="1"/></svg></button>
    <span class="tool-separator"></span><button data-action="check" title="Check design · D" aria-label="Run design checks"><svg viewBox="0 0 24 24"><path d="M5 12l4 4L19 6M19 12v8H4V5h8"/></svg></button>
   </div>
   <div class="board-stats" id="boardStats"></div>
   <div class="camera-controls" id="cameraControls"><label for="tilt">Tilt <input id="tilt" type="range" min="0" max="65" value="27"><span id="tiltValue">27°</span></label><button data-action="xray" id="xrayButton" title="See pads through component bodies · X">X-ray</button><button data-action="airwires" id="airButton" class="active" title="Toggle unrouted connection lines">Airwires</button><button data-action="grid" id="gridButton" class="active" title="Toggle grid · G">Grid</button></div>
   <div id="selectionBar" class="selection-bar" hidden></div>
   <div id="busyBar" class="busy-bar" hidden><span class="spinner"></span><span id="busyText">Working</span><button data-action="cancel-job">Cancel</button></div>
   <div id="tooltip" class="canvas-tooltip" hidden></div>
  </div>
  <div class="contextbar"><span class="tool-name" id="toolName">SELECT</span><span id="toolHint" hidden></span><button data-action="tool-help" id="toolHelp" class="tool-help" title="Tool help" aria-label="Select tool help">?</button><div class="route-width"><button data-action="planes" class="via-context-button">Planes</button><button data-tool="via" class="via-context-button" title="Place a plated connection between both copper layers">＋ Via</button><label for="traceWidth">Trace</label><select id="traceWidth"><option value=".2">Fine · 0.20 mm</option><option value=".4" selected>Standard · 0.40 mm</option><option value=".8">Wide · 0.80 mm</option><option value="1.2">Heavy · 1.20 mm</option><option value="custom">Custom…</option></select></div></div>
 </section>
 <aside id="inspector" class="inspector" aria-label="Selection inspector"><div class="inspector-heading"><span>INSPECTOR</span><button data-action="toggle-inspector" aria-label="Close inspector">×</button></div><div id="inspectorContent" class="inspector-content"></div></aside>
</main>
<footer class="statusbar"><span id="statusMessage" role="status" aria-live="polite">Ready.</span><div><span id="cursorPosition">X — &nbsp; Y —</span><button data-action="units" id="unitsButton">mm</button><span id="gridStatus">1.27 mm grid</span></div></footer>
<div id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="modal"><div class="modal-header"><div><span class="eyebrow" id="modalEyebrow">COPPERBENCH</span><h2 id="modalTitle"></h2></div><button id="modalClose" aria-label="Close dialog">×</button></div><div id="modalBody" class="modal-body"></div><div id="modalFooter" class="modal-footer"></div></dialog>
<input type="file" id="fileInput" accept=".json,.zip,.kicad_pcb,.kicad_mod,.gbr,.ger,.drl" hidden><input type="file" id="imageInput" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml" hidden><input type="file" id="svgInput" accept=".svg" hidden>

function changePlaneNet(layer,net){const old=C.Planes.get(S.doc,layer);const apply=()=>{commit(net?'Assigned '+layer+' plane':'Removed '+layer+' plane',d=>C.Planes.set(d,layer,net));};if(old&&net&&net!==old.net)ask('Change this plane’s net?',`<p>Change ${E(C.netName(S.doc,old.net))} to ${E(C.netName(S.doc,net))} on ${layer} copper?</p><div class="notice">Existing pins, traces and vias keep their original nets. They are not relabelled or merged. Refill and connection checks will expose any lost attachments.</div>`,apply,'Change plane net');else apply();}
function newPlaneNet(layer){modal('Name the '+layer+' plane.',`<label>Electrical net name<input id="planeNewNetName" maxlength="80" placeholder="For example: GND, +3V3 or +5V"></label><p class="support-note">The name records your intent; it does not set or verify a voltage. Pins are only assigned when you explicitly connect them.</p>`,[{label:'Cancel',run:()=>{closeModal();renderDrawer();}},{label:'Create and assign',primary:true,run:()=>{const name=$('#planeNewNetName').value.trim();if(!name)throw Error('Enter a net name.');commit('Created '+layer+' plane net',d=>C.Planes.set(d,layer,C.newNet(d,name)));closeModal();openPlanes();}}]);}
function planeSettings(layer){const z=C.Planes.get(S.doc,layer);if(!z)return;modal('Connections to '+C.netName(S.doc,z.net)+'.',`<label class="checkbox-label"><input type="checkbox" id="planeThermal" ${z.thermal!==false?'checked':''}>Use solder-friendly thermal spokes at component pads</label><p class="support-note">Through vias use solid copper attachment. Component pads use the selected style. No current-carrying rating is implied.</p><div class="form-grid"><label>Thermal gap · mm<input type="number" id="planeGap" min=".05" max="5" step="any" value="${z.gap}"></label><label>Spoke width · mm<input type="number" id="planeSpoke" min="${Math.max(.3,S.doc.profile.minTrace)}" max="5" step="any" value="${z.spoke}"></label><label>Fill cell · mm<input type="number" id="planeStep" min=".1" max="1" step="any" value="${z.step}"></label></div><div class="notice">The conservative cell-derived fill may lose fine passages. The fill engine reduces the chosen cell size when necessary for spokes. Inspect the real output; this is not a thermal or impedance solver.</div>`,[{label:'Cancel',run:closeModal},{label:'Apply settings',primary:true,run:()=>{if(!$$('#modal input[type=number]').every(e=>e.checkValidity()))throw Error('Enter valid fill dimensions.');const opts={thermal:$('#planeThermal').checked,gap:+$('#planeGap').value,spoke:+$('#planeSpoke').value,step:+$('#planeStep').value};commit('Changed '+layer+' plane connections',d=>C.Planes.set(d,layer,z.net,opts));closeModal();}}]);}
function armPlane(layer){if(!C.Planes.get(S.doc,layer)){openPlanes();toast('Choose a net for that face first.');return;}setTool('plane-connect');S.planeTarget=layer;openPlanes();S.selection=[];S.selectedPads=[];refresh();toast('Click a component lead to preview its '+layer+' plane connection.');}
function choosePlaneDialog(ids){ids=ids||[...S.selectedPads];if(!ids.length&&S.focusPad)ids=[S.focusPad];if(!ids.length){openPlanes();toast('Choose a face’s Connect a lead button, then click a component lead.');return;}const planes=C.Planes.list(S.doc);if(!planes.length){openPlanes();toast('Assign a plane net first. Your picked leads are still selected.');return;}modal('Connect '+ids.length+' lead'+(ids.length===1?'':'s')+' to a plane.',`<p>${ids.map(id=>'<span class="pin-badge">'+E(C.reference(S.doc,id))+'</span>').join(' ')}</p><label>Target copper face<select id="planeTarget">${planes.map(z=>`<option value="${z.layer}" ${z.layer==='bottom'?'selected':''}>${z.layer==='top'?'Top':'Bottom'} · ${E(C.netName(S.doc,z.net))}</option>`).join('')}</select></label><div class="notice">Unassigned leads can adopt the plane net. A lead assigned to a different net is blocked, never silently reassigned. No copper is changed until you accept the checked preview.</div>`,[{label:'Cancel',run:closeModal},{label:'Preview connection',primary:true,run:()=>{const layer=$('#planeTarget').value;closeModal();requestPlaneConnection(ids,layer);}}]);}
function requestPlaneConnection(ids,layer){if(!ids.length){toast('Pick at least one lead first.');return;}S.routePreview=null;S.selectedPads=[...ids];S.planeTarget=layer;S.tool='plane-connect';S.highlightNet=C.Planes.get(S.doc,layer)?.net;stopPlaneFill();refresh();runJob('plane-connect',{padIds:ids,options:{layer,width:S.doc.settings.traceWidth}},res=>{res.revision=S.revision;S.routePreview=res;renderSelectionBar();renderer.request();toast(res.steps.map(s=>s.message).join(' ')+' Keep the connection or discard the preview.');});}
function acceptPlanePlan(p){if(p.revision!==S.revision){S.routePreview=null;throw Error('The board changed. Preview the plane connection again.');}stopPlaneFill();commit('Connected '+p.steps.length+' lead(s) to '+p.layer+' plane',d=>Object.assign(d,p.document),{copper:false});S.routePreview=null;S.selectedPads=[];S.tool='select';S.highlightNet=p.net;refresh();toast('Plane connection accepted. Inspect Connections for the whole net and any stranded regions.');}
function inspectPlane(layer){const z=C.Planes.get(S.doc,layer);if(!z)return;runJob('check',{},res=>{S.findings=res.findings;S.connectivity=res.connectivity;S.planeReport=res.planes;S.checkRevision=S.revision;refresh(false);const r=res.planes.find(a=>a.layer===layer);modal(layer.toUpperCase()+' · '+C.netName(S.doc,z.net),`<div class="notice"><strong>${E(planeSummary(layer))}</strong><br>Status is based on filled copper. “Connected” means a path to this face’s largest electrically connected filled region, not a verified power source, voltage or current rating.</div><div class="table-wrap"><table><thead><tr><th>Lead</th><th>Pad face</th><th>Plane connection</th><th>Action</th></tr></thead><tbody>${r.rows.map(p=>`<tr><td>${E(p.ref+'.'+p.pin)}</td><td>${E(p.layer)}</td><td>${E({'connected':'Connected to main region','isolated':'Isolated copper region','needs-via':'Needs a via / copper path','unconnected':'No copper path','stale':'Refill required','empty':'No retained plane'}[p.state])}</td><td><button data-plane-pin="${E(p.id)}">Connect…</button></td></tr>`).join('')}</tbody></table></div>${!r.rows.length?'<p>No component leads have this net yet. Use Connect a lead to assign and attach one.</p>':''}<p class="support-note">The two faces are not electrically connected merely because both are named GND. Through-hole pads or vias must join them.</p>`,[{label:'Close',run:closeModal},{label:'Refill now',run:()=>{closeModal();fillZones();}}]);});}

function commit(label,fn,opts={}){const before=JSON.stringify(S.doc);try{fn(S.doc);C.Blocks.sync(S.doc);C.Planes.sync(S.doc);C.validateDoc(S.doc);if(opts.copper!==false)S.doc.zones.forEach(z=>z.fill=null);S.doc.updated=new Date().toISOString();if(JSON.stringify(S.doc)===before)return;pushHistory(before,label);S.revision++;S.fabData=null;S.routePreview=null;S.checkRevision=-1;scheduleSave();refresh(opts.panels!==false);scheduleChecks();$('#statusMessage').textContent=label;}catch(e){S.doc=JSON.parse(before);toast(e.message,true);refresh();throw e;}}
function commitDragged(before,label){if(JSON.stringify(S.doc)===before)return;C.Blocks.sync(S.doc);C.Planes.sync(S.doc);C.validateDoc(S.doc);pushHistory(before,label);S.doc.zones.forEach(z=>z.fill=null);S.doc.updated=new Date().toISOString();S.revision++;S.fabData=null;S.checkRevision=-1;scheduleSave();refresh();scheduleChecks();}
function undo(){cancelDrawing();if(!S.history.length)return;const h=S.history.pop();S.future.push({before:JSON.stringify(S.doc),label:h.label});S.doc=JSON.parse(h.before);S.revision++;S.selection=[];S.selectedPads=[];S.routePreview=null;S.fabData=null;scheduleSave();refresh();scheduleChecks();toast('Undid: '+h.label);}
function redo(){cancelDrawing();if(!S.future.length)return;const h=S.future.pop();S.history.push({before:JSON.stringify(S.doc),label:h.label});S.doc=JSON.parse(h.before);S.revision++;S.selection=[];S.selectedPads=[];S.fabData=null;scheduleSave();refresh();scheduleChecks();toast('Redid: '+h.label);}
function worker(){if(!window.CB_WORKER_SOURCE)throw Error('Worker bundle is missing. Use the complete app folder or the portable HTML edition.');const url=URL.createObjectURL(new Blob([window.CB_WORKER_SOURCE],{type:'text/javascript'}));const w=new Worker(url);URL.revokeObjectURL(url);return w;}
function cancelJob(){if(S.job){S.job.worker.terminate();S.job=null;$('#busyBar').hidden=true;toast('Operation cancelled. The board was not changed.');}}
function runJob(kind,args,onResult){cancelJob();const w=worker(),id=C.uid('job'),revision=S.revision;S.job={worker:w,id,revision};$('#busyBar').hidden=false;$('#busyText').textContent=kind==='fill'?'Filling copper zones…':kind==='plane-connect'?'Checking a plane connection…':kind==='check'?'Checking the design…':'Finding a copper path…';w.onmessage=e=>{if(e.data.id!==id)return;if(e.data.progress){let p=e.data.progress;$('#busyText').textContent=(kind==='fill'?'Filling zones':kind==='plane-connect'?'Connecting leads to plane':'Routing connections')+' · '+p.complete+' / '+p.total;return;}w.terminate();if(S.job?.id!==id)return;S.job=null;$('#busyBar').hidden=true;if(e.data.error){toast(e.data.error,true);scheduleAutoPlanes();return;}if(S.revision!==revision){toast('The board changed while this operation ran. Its stale result was discarded.');return;}onResult(e.data.result);};w.onerror=e=>{w.terminate();S.job=null;$('#busyBar').hidden=true;toast('The geometry worker failed: '+e.message,true);};w.postMessage({id,kind,document:C.clone(S.doc),...args});}
function scheduleChecks(){clearTimeout(checkTimer);checkTimer=setTimeout(()=>runChecks(false),350);scheduleAutoPlanes();}
function runChecks(show=false){clearTimeout(checkTimer);if(show){runJob('check',{},result=>{S.findings=result.findings;S.connectivity=result.connectivity;S.planeReport=result.planes||[];S.checkRevision=S.revision;refresh(false);showFindings();});return;}if(checkWorker)checkWorker.terminate();const w=worker(),rev=S.revision;checkWorker=w;w.onmessage=e=>{if(e.data.progress)return;w.terminate();if(checkWorker===w)checkWorker=null;if(e.data.result&&rev===S.revision){S.findings=e.data.result.findings;S.connectivity=e.data.result.connectivity;S.planeReport=e.data.result.planes||[];S.checkRevision=rev;refresh(false);}};w.onerror=()=>{w.terminate();checkWorker=null;$('#statusMessage').textContent='Automatic checks failed. Use Check design before exporting.';};w.postMessage({id:'checks',kind:'check',document:C.clone(S.doc)});}
function modal(title,body,buttons=[],eyebrow='COPPERBENCH'){if($('#modal').open)closeModal();lastFocus=document.activeElement;$('#modalTitle').textContent=title;$('#modalEyebrow').textContent=eyebrow;$('#modalBody').innerHTML=body;$('#modalFooter').innerHTML='';for(const b of buttons){let btn=document.createElement('button');btn.textContent=b.label;btn.className=b.primary?'primary':b.danger?'danger':'';if(b.id)btn.id=b.id;btn.disabled=!!b.disabled;btn.onclick=()=>{try{let r=b.run?b.run():closeModal();if(r?.catch)r.catch(e=>toast(e.message,true));}catch(e){toast(e.message,true);}};$('#modalFooter').append(btn);}$('#modal').showModal();$('#modalBody input:not([type=checkbox]),#modalBody select,#modalFooter button')?.focus();}
function closeModal(){if(modalCleanup){modalCleanup();modalCleanup=null;}$('#modal').close();lastFocus?.focus?.();}
$('#modalClose').onclick=closeModal;$('#modal').addEventListener('cancel',()=>{if(modalCleanup){modalCleanup();modalCleanup=null;}});
function ask(title,body,onConfirm,label='Continue'){modal(title,body,[{label:'Cancel',run:closeModal},{label,primary:true,run:()=>{closeModal();onConfirm();}}]);}
function download(filename,content,type='text/plain'){const blob=content instanceof Blob?content:new Blob([content],{type});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function slug(s){return String(s).normalize('NFKD').replace(/[^a-z0-9_-]+/gi,'-').replace(/^-|-$/g,'').slice(0,80)||'board';}
function selected(){const id=S.selection[0];if(!id)return null;if(id==='board')return{type:'board',object:S.doc.board,id};for(const [type,key] of [['part','parts'],['trace','traces'],['via','vias'],['hole','holes'],['art','art'],['zone','zones'],['keepout','keepouts'],['cutout','cutouts']]){let o=S.doc[key].find(o=>o.id===id);if(o)return{type,object:o,id};}return null;}
function select(id,append=false){if(append){S.selection=S.selection.includes(id)?S.selection.filter(x=>x!==id):[...S.selection,id];}else S.selection=id?[id]:[];S.focusPad=null;let p=S.doc.parts.find(p=>p.id===id);S.highlightNet=p&&p.pads.length===1?p.pads[0].net:S.doc.vias.find(v=>v.id===id)?.net||null;renderInspector();renderer.request();}
// Keep exceptional plane status on the board; only routine explanations move to Help.
function planeBadge(){const z=C.Planes.get(S.doc,S.side),r=S.checkRevision===S.revision?S.planeReport?.find(a=>a.id===z?.id):null;let attention='',warning=false;if(z){if(S.planeFilling)attention='Filling…';else if(!z.fill){attention=S.planeFillError?'Refill failed':'Needs refill';warning=true;}else if(r?.state==='split'){attention='Split plane';warning=true;}else if(r?.state==='empty'){attention='No connected copper';warning=true;}else if(r&&r.connected<r.total){attention=(r.total-r.connected)+' disconnected';warning=true;}}return `<button class="plane-indicator ${warning?'has-warning':''}" data-action="planes" title="${E(z?planeSummary(S.side):'Assign a net to this copper face')}">${S.side==='top'?'Top':'Bottom'}: ${E(z?C.netName(S.doc,z.net):'No plane')}${attention?' · '+E(attention):''}</button>`;}
function refresh(panels=true){document.documentElement.dataset.theme=S.theme;document.body.classList.toggle('advanced',S.mode==='advanced');$('#modeSelect').value=S.mode;$('#titleButton').textContent=S.doc.title;$('#projectDimensions').textContent=`${S.doc.board.width} × ${S.doc.board.height} mm`;$('#unitsButton').textContent=S.units;$('#gridStatus').textContent=fmt(S.doc.settings.grid)+' '+S.units+' grid';$('#tiltValue').textContent=S.tilt+'°';$('#tilt').value=S.tilt;$$('[data-side]').forEach(b=>b.classList.toggle('active',b.dataset.side===S.side));$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===S.view));$$('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===S.tool));$$('[data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===S.panel));$('#xrayButton').classList.toggle('active',S.xray);$('#airButton').classList.toggle('active',S.airwires);$('#gridButton').classList.toggle('active',S.grid);$('#cameraControls label').style.display=S.view==='bench'?'':'none';const w=String(S.doc.settings.traceWidth);$('#traceWidth').value=[...$('#traceWidth').options].some(o=>+o.value===+w)?[...$('#traceWidth').options].find(o=>+o.value===+w).value:'custom';$('#boardStats').innerHTML=`<span class="board-counts">${S.doc.parts.length} parts · ${S.doc.nets.length} nets · ${S.doc.vias.length} vias</span><div class="board-state"><button class="unrouted-status" data-action="check" title="Run design checks">${S.checkRevision===S.revision?(S.connectivity?.unrouted??'—')+' unrouted':'Checking…'}</button>${planeBadge()}</div>`;
 $$('[data-action=undo]').forEach(b=>b.disabled=!S.history.length);$$('[data-action=redo]').forEach(b=>b.disabled=!S.future.length);if(panels){renderDrawer();renderInspector();}else{if(!S.selection.length)renderInspector();if(['nets','planes'].includes(S.panel)&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement?.tagName))renderDrawer();}renderSelectionBar();updateToolHint();renderer.request();}
function setPanel(panel){S.panel=panel;renderDrawer();$$('[data-panel]').forEach(b=>b.classList.toggle('active',b.dataset.panel===panel));}
function setTool(tool){if(tool==='via'&&S.drawing&&S.tool==='trace'){armVia();return;}cancelDrawing();S.tool=tool;S.placing=null;if(tool!=='connect'&&tool!=='plane-connect')S.selectedPads=[];if(['outline','outline-rect','outline-circle','cutout','keepout','zone'].includes(tool)){if(tool.startsWith('outline'))S.selection=['board'];}if(tool==='via'){S.selection=[];$('#inspector').classList.remove('collapsed');}if(S.view==='fabrication')S.view='copper';refresh();$('#canvas').focus();}
function cancelDrawing(){S.blockPlacing=null;S.viaPending=false;S.viaPreview=null;S.drawing=null;S.tracePreview=null;S.measure=null;S.routePreview=null;S.placing=null;S.placeRotation=0;renderSelectionBar();renderer.request();}

## Adafruit BME280 Breakout PCB

<a href="http://www.adafruit.com/products/2652"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

PCB files for the Adafruit BME280 Breakout. Format is EagleCAD schematic and board layout
* https://www.adafruit.com/product/2652

### Description

Bosch has stepped up their game with their new BME280 sensor, an environmental sensor with temperature, barometric pressure and humidity! This sensor is great for all sorts of weather/environmental sensing and can even be used in both I2C and SPI!

This precision sensor from Bosch is the best low-cost sensing solution for measuring humidity with ±3% accuracy, barometric pressure with ±1 hPa absolute accuraccy, and temperature with ±1.0°C accuracy. Because pressure changes with altitude, and the pressure measurements are so good, you can also use it as an altimeter with  ±1 meter or better accuracy!

The BME280 is the next-generation of sensors from Bosch, and is the upgrade to the BMP085/BMP180/BMP183 - with a low altitude noise of 0.25m and the same fast conversion time. It has the same specifications, but can use either I2C or SPI. For simple easy wiring, go with I2C. If you want to connect a bunch of sensors without worrying about I2C address collisions, go with SPI.

## Adafruit DS3231 Precision RTC Breakout PCB
<a href="http://www.adafruit.com/products/5188"><img src="assets/5188.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a><br/>
<a href="http://www.adafruit.com/products/3013"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

The datasheet for the DS3231 explains that this part is an "Extremely Accurate I²C-Integrated RTC/TCXO/Crystal". And, hey, it does exactly what it says on the tin! This Real Time Clock (RTC) is the most precise you can get in a small, low power package.

Most RTCs use an external 32kHz timing crystal that is used to keep time with low current draw. And that's all well and good, but those crystals have slight drift, particularly when the temperature changes (the temperature changes the oscillation frequency very very very slightly but it does add up!) This RTC is in a beefy package because the crystal is inside the chip! And right next to the integrated crystal is a temperature sensor. That sensor compensates for the frequency changes by adding or removing clock ticks so that the timekeeping stays on schedule.

This is the finest RTC you can get, and now we have it in a compact, breadboard-friendly breakout. With a coin cell plugged into the back, you can get years of precision timekeeping, even when main power is lost. Great for datalogging and clocks, or anything where you need to really know the time.

## Adafruit TB6612 Motor Driver Breakout PCB

<a href="http://www.adafruit.com/products/2448"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

PCB files for the Adafruit TB6612 Motor Driver Breakout. Format is EagleCAD schematic and board layout
* https://www.adafruit.com/product/2448

### DESCRIPTION
Spin two DC motors, step one bi-polar or uni-polar stepper, or fire off two solenoids with 1.2A per channel using the TB6612. These are perhaps better known as "the drivers in our assembled Adafruit Motorshield or Motor HAT." We really like these dual H-bridges, so if you want to control motors without a shield or HAT these are easy to include on any solderless breadboard or perma-proto.

We solder on TB6612 onto a breakout board for you here, with a polarity protection FET on the motor voltage input and a pullup on the "standby" enable pin. Each breakout chip contains two full H-bridges (four half H-bridges). That means you can drive 2-4 solenoids (only two can be active at a time, on opposite bridges), two DC motors bi-directionally, or one stepper motor. Just make sure they're good for 1.2 Amp or less of current, since that's the limit of this chip. They do handle a peak of 3A but that's just for a short amount of time, like 20 milliseconds. What we like most about this particular driver is that it comes with built in kick-back diodes internally so you don't have to worry about the inductive kick damaging your project or driver!

There's two digital inputs per H-bridge (one for each half of the bridge) as well as a PWM input per driver so you can control motor speed. Runs at 2.7V-5V logic. The motor voltage is separate from the logic voltage. Good for motor voltages from 4.5V up to 13.5V! This wont work well for 3V motors.

## Adafruit 128x64 Monochrome OLED PCB
<a href="http://www.adafruit.com/products/326"><img src="assets/326.jpg?raw=true" width="500px"><br/>
<a href="http://www.adafruit.com/products/326"><img src="assets/image.jpg?raw=true" width="500px"><br/>
Click here to purchase one from the Adafruit shop</a>

These displays are small, only about 1" diagonal, but very readable due to the high contrast of an OLED display. This display is made of 128x64 individual white OLED pixels, each one is turned on or off by the controller chip. Because the display makes its own light, no backlight is required. This reduces the power required to run the OLED and is why the display has such high contrast; we really like this miniature display for its crispness!

This breakout can be used with either an SPI or I2C interface - selectable by soldering two jumpers on the back. The design is completely 5V-ready, with an onboard regulator and built in boost converter. It's easier than ever to connect directly to your 3V or 5V microcontroller without needing any kind of level shifter!

async function exportDialog(){let f=G.findings(S.doc),errors=f.filter(f=>f.severity==='error');S.findings=f;S.checkRevision=S.revision;let stale=S.doc.zones.some(z=>!z.fill);modal('Inspect. Then fabricate.',`<div class="findings-summary"><span class="tag error">${errors.length} blocking design findings</span><span class="tag warning">${f.filter(f=>f.severity==='warning').length} warnings</span></div><div class="notice ${errors.length?'danger':''}">${errors.length?'This board is not clear for fabrication. Resolve the errors or explicitly export diagnostic files for inspection.':'No geometric blocking findings. This is not a guarantee of circuit function or manufacturing approval.'}<br>Always review the manufacturer’s uploaded-board preview before ordering.</div><div class="form-grid"><label>Gerber attributes<select id="exportFormat"><option value="x2">Gerber X2 (default)</option><option value="legacy">RS-274X compatibility</option></select></label><label>Stencil layers<select id="exportPaste"><option value="no">Do not include paste</option><option value="yes">Include top & bottom paste</option></select></label></div><div class="file-row">Top / bottom copper <small>Gerber</small></div><div class="file-row">Top / bottom solder mask <small>Gerber</small></div><div class="file-row">Top / bottom silkscreen <small>Gerber</small></div><p class="support-note" id="silkExportInventory">${C.M.silkInventory(S.doc).map(s=>`${s.layer}: ${s.strokes} source strokes · ${s.shapes} filled shapes`).join('<br>')}<br>Includes visible reference and polarity marks. Openings and board edges are clipped in the exported files.</p><div class="file-row">Board outline & cutouts <small>Gerber</small></div><div class="file-row">Plated / non-plated drills & slots <small>Excellon</small></div>${errors.length?`<label class="checkbox-label"><input type="checkbox" id="diagnosticExport">I understand: export diagnostic files despite these errors</label>`:''}${stale?'<div class="notice danger">Unfilled or stale zones cannot be exported, even in diagnostic mode. Refill first.</div>':''}<div class="section-label">ALSO AVAILABLE</div><div class="button-row"><button data-action="export-kicad">KiCad board</button><button data-action="save">Native JSON</button><button data-action="bom">BOM CSV</button></div><p class="support-note">All exports are generated on this device. Nothing is uploaded or sent to a manufacturer.</p>`,[{label:'Design checks',run:()=>showFindings()},{label:'Read-back preview',run:()=>{closeModal();fabricationView();}},{label:'Download fabrication ZIP',primary:true,id:'downloadFab',disabled:!!errors.length||stale,run:async()=>{const files=C.M.files(S.doc,{x2:$('#exportFormat').value==='x2',paste:$('#exportPaste').value==='yes'});for(const [name,text] of Object.entries(files))name.endsWith('.drl')?C.M.readDrill(text):C.M.readGerber(text);const zip=new JSZip();for(const [name,text] of Object.entries(files))zip.file(name,text);zip.file('READ-ME.txt',`COPPERBENCH ${C.VERSION}\nProject: ${S.doc.title}\nTwo copper layers. ${S.doc.board.width} x ${S.doc.board.height} mm.\nCoordinate origin: lower-left of board bounding box. Bottom layers are NOT mirrored.\nGerber metric 4.6 format; Excellon metric explicit decimals.\nRules: ${S.doc.profile.name}, verified ${S.doc.profile.verified}.\nErrors at export: ${errors.length}. Warnings: ${f.filter(x=>x.severity==='warning').length}.\n${errors.length?'DIAGNOSTIC EXPORT — NOT CLEARED FOR FABRICATION.\n':''}Review all layers, drill alignment, plated/non-plated slots, and the manufacturer upload preview. No manufacturer or physical validation is claimed.\n`);const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE'});download(slug(S.doc.title)+(errors.length?'-DIAGNOSTIC':'')+'-fabrication.zip',blob);toast('Gerber and drill ZIP generated. Review it independently before ordering.');}}]);if($('#diagnosticExport'))$('#diagnosticExport').onchange=e=>$('#downloadFab').disabled=!e.target.checked||stale;}
function showNetEdit(id){let n=S.doc.nets.find(n=>n.id===id);if(!n)return;modal('Edit '+n.name,`<div class="form-stack"><label>Name<input id="netEditName" value="${E(n.name)}" maxlength="80"></label><label>Routing width · mm<input id="netEditWidth" type="number" min=".01" max="25" step="any" value="${n.width||S.doc.settings.traceWidth}"></label></div><div class="notice">Changing the default width does not retroactively alter existing traces. Use the route inspector to apply a width to existing copper.</div>`,[{label:'Cancel',run:closeModal},{label:'Rip up net copper',danger:true,run:()=>{closeModal();ask('Remove routed copper?',`<p>Remove unlocked traces and vias on <strong>${E(n.name)}</strong>? Pin assignments remain intact. Undo is available.</p>`,()=>commit('Removed copper on '+n.name,d=>{d.traces=d.traces.filter(t=>t.net!==id||t.locked);d.vias=d.vias.filter(v=>v.net!==id||v.locked);}), 'Remove copper');}},{label:'Save net',primary:true,run:()=>{const name=$('#netEditName').value.trim(),width=+$('#netEditWidth').value;if(!name||!$('#netEditWidth').checkValidity())throw Error('Enter a valid name and width.');if(S.doc.nets.some(v=>v.id!==id&&v.name===name))throw Error('A different net already uses that name.');commit('Edited net',d=>{let nn=d.nets.find(n=>n.id===id);nn.name=name;nn.width=width;},{copper:false});closeModal();}}]);}

><div class="notice">Check pin numbering, pad sizes, and the actual mechanical drawing. This wizard creates geometry; it does not certify a package.</div>`;

function polarityDialog(){

  if(!$$('#modal input[type=number]').every(e=>e.checkValidity()))throw Error('Enter valid marking dimensions.');

  commit('Updated polarity labels',d=>{const part=d.parts.find(a=>a.id===p.id);const changed=part.pads.some((a,i)=>(C.polarityRole(part,a)||'none')!==roles[i]);part.pads.forEach((a,i)=>a.polarity=roles[i]);part.polaritySilk=options;if(changed)part.verified=false;},{copper:false});closeModal();
 }}]);

function editPads(){let sel=selected();if(sel?.type!=='part')return;let p=sel.object;modal('Edit '+p.ref+' footprint pads.',`<div class="notice danger">These dimensions control manufacturing. Editing clears the “checked” status. Changing a drill or pad can introduce annular-ring and clearance failures.</div><div class="table-wrap"><table><thead><tr><th>Pin</th><th>X</th><th>Y</th><th>W</th><th>H</th><th>Drill</th><th>Slot travel</th><th>Shape</th></tr></thead><tbody>${p.pads.map((a,i)=>`<tr><td><input style="width:48px" data-pedit="${i}" data-key="number" value="${E(a.number)}"></td>${['x','y','w','h','drill','slot'].map(k=>`<td><input style="width:63px" type="number" step="any" data-pedit="${i}" data-key="${k}" value="${a[k]||0}"></td>`).join('')}<td><select data-pedit="${i}" data-key="shape">${['circle','rect','oval'].map(v=>`<option ${a.shape===v?'selected':''}>${v}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`,[{label:'Cancel',run:closeModal},{label:'Apply pad geometry',primary:true,run:()=>{let pads=C.clone(p.pads);for(const el of $$('[data-pedit]'))pads[+el.dataset.pedit][el.dataset.key]=el.type==='number'?+el.value:el.value;for(const a of pads)if(!a.number||!Number.isFinite(a.x)||!Number.isFinite(a.y)||a.w<=0||a.h<=0||a.drill<0||a.slot<0)throw Error('Each pad needs valid dimensions and an identity.');commit('Edited footprint geometry',d=>{let part=d.parts.find(x=>x.id===p.id);if(part.internalGroups){const rename=new Map(part.pads.map((a,i)=>[String(a.number),String(pads[i].number)]));part.internalGroups=part.internalGroups.map(g=>g.map(n=>rename.get(n)));}part.pads=pads;part.verified=false;if(part.catalog)part.catalog.reviewed=false;});closeModal();}}]);}
function editBody(){let p=selected()?.object;if(!p?.body)return;modal('Representative body.',`<div class="notice">Visual only. These dimensions never change the copper, holes, footprint, or electrical connections.</div><div class="form-grid">${[['w','Width'],['h','Depth'],['z','Height']].map(([k,l])=>`<label>${l} · mm<input id="body-${k}" type="number" min=".1" max="150" step="any" value="${p.body[k]}"></label>`).join('')}<label>Appearance<select id="body-kind">${['ic','resistor','diode','led','capacitor','disc','header','terminal','switch','transistor','smd-resistor','smd-cap','testpoint','platform','socket','rightangle','shrouded','jst','usb','barrel','slide','dipswitch','trimmer','pot','encoder','to220','sot223','relay','fuse','loop','jumper','smdled','rgbled','smd-diode'].map(v=>`<option ${p.body.kind===v?'selected':''}>${v}</option>`).join('')}</select></label></div>`,[{label:'Cancel',run:closeModal},{label:'Update appearance',primary:true,run:()=>{if(!$$('#modal input[type=number]').every(i=>i.checkValidity()))throw Error('Invalid body dimension.');const b={w:+$('#body-w').value,h:+$('#body-h').value,z:+$('#body-z').value,kind:$('#body-kind').value};commit('Changed representative appearance',d=>{d.parts.find(a=>a.id===p.id).body=b;},{copper:false});closeModal();}}]);}

async function imageWizard(data,name,existing=null){const img=await loadImage(data);let rects=[],info=null,prior=existing?.imageSettings||{};modal('Turn an image into silkscreen.',`<div class="image-previews"><div><small>Original, retained in the project</small><canvas id="originalImage"></canvas></div><div><small>Printable vector conversion</small><canvas id="convertedImage"></canvas></div></div><div class="form-grid"><label>Physical width · mm<input id="imageWidth" type="number" min="1" max="300" step="any" value="${prior.width||24}"></label><label>Smallest pixel feature · mm<input id="imageFeature" type="number" min=".08" max="2" step="any" value="${prior.feature||.15}"></label><label>Threshold · <span id="thresholdNumber">${prior.threshold||145}</span><input id="imageThreshold" type="range" min="1" max="254" value="${prior.threshold||145}"></label></div><div class="button-row"><label class="checkbox-label"><input id="imageInvert" type="checkbox" ${prior.invert?'checked':''}>Invert ink</label><label class="checkbox-label"><input id="imageClean" type="checkbox" ${prior.clean===false?'':'checked'}>Remove isolated specks</label></div><div id="imageInfo" class="notice"></div><p class="support-note">The conversion becomes real vector rectangles in the silkscreen Gerber. Fine detail can be lost; review the result at its physical size. No image leaves this browser.</p>`,[{label:'Cancel',run:closeModal},{label:existing?'Replace conversion':'Place converted image',primary:true,run:()=>{if(!info||!rects.length)throw Error('The conversion is empty. Adjust its threshold or invert it.');let assetId=existing?.assetId||C.uid('asset'),a=existing?C.clone(existing):{id:C.uid('a'),kind:'image',x:S.doc.board.width/2-info.width/2,y:S.doc.board.height/2-info.height/2,rotation:0,layer:S.side,mirror:false,width:.15};a.name=name;a.assetId=assetId;a.rects=rects;a.imageSettings=info.settings;commit('Converted image to vector silkscreen',d=>{if(!d.assets.some(a=>a.id===assetId))d.assets.push({id:assetId,name,data});if(existing)d.art[d.art.findIndex(x=>x.id===existing.id)]=a;else d.art.push(a);},{copper:false});closeModal();S.tool='select';S.panel='silk';S.selection=[a.id];refresh();}}]);
 const orig=$('#originalImage');orig.width=600;orig.height=360;let ox=orig.getContext('2d'),fit=Math.min(580/img.width,340/img.height);ox.fillStyle='#eef0e5';ox.fillRect(0,0,600,360);ox.drawImage(img,(600-img.width*fit)/2,(360-img.height*fit)/2,img.width*fit,img.height*fit);
 function convert(){if(!$('#imageWidth'))return;const width=+$('#imageWidth').value,feature=+$('#imageFeature').value,threshold=+$('#imageThreshold').value,invert=$('#imageInvert').checked,clean=$('#imageClean').checked;if(!(width>=1&&width<=300&&feature>=.08&&feature<=2))return;$('#thresholdNumber').textContent=threshold;let nx=Math.min(600,Math.max(2,Math.round(width/feature))),ny=Math.max(1,Math.round(nx*img.height/img.width));if(ny>1500){$('#imageInfo').textContent='This image is too tall at the selected resolution. Increase the pixel feature size.';info=null;return;}let cv=document.createElement('canvas');cv.width=nx;cv.height=ny;let cx=cv.getContext('2d',{willReadFrequently:true});cx.fillStyle='white';cx.fillRect(0,0,nx,ny);cx.drawImage(img,0,0,nx,ny);let pixels=cx.getImageData(0,0,nx,ny).data,mask=new Uint8Array(nx*ny);for(let i=0;i<mask.length;i++){let lum=.2126*pixels[i*4]+.7152*pixels[i*4+1]+.0722*pixels[i*4+2];mask[i]=invert?+(lum>=threshold):+(lum<threshold);}if(clean){let old=mask.slice();for(let y=0;y<ny;y++)for(let x=0;x<nx;x++){let k=y*nx+x;if(!old[k])continue;let neighbors=0;for(let yy=Math.max(0,y-1);yy<=Math.min(ny-1,y+1);yy++)for(let xx=Math.max(0,x-1);xx<=Math.min(nx-1,x+1);xx++)if(yy!==y||xx!==x)neighbors+=old[yy*nx+xx];if(!neighbors)mask[k]=0;}}

 if(['gbr','ger','drl'].includes(ext)){let raw=await file.text(),data={[file.name]:ext==='drl'?C.M.readDrill(raw):C.M.readGerber(raw)};openManufacturingReference(data);return;}

move();let b=G.bounds(sample);if(b.maxX<=b.minX||b.maxY<=b.minY)throw Error('SVG outline has no area.');modal('Set the physical SVG size.',`<label>Board width · mm<input id="svgWidth" type="number" min="6.35" max="500" step="any" value="${S.doc.board.width}"></label><p class="support-note">Aspect ratio is retained. SVG display pixels do not imply millimetres. Curves are sampled into explicit outline vertices.</p>`,[{label:'Cancel',run:closeModal},{label:'Apply outline',primary:true,run:()=>{const width=+$('#svgWidth').value;if(!$('#svgWidth').checkValidity())throw Error('Invalid board width.');let scale=width/(b.maxX-b.minX),pts=sample.map(p=>({x:C.q((p.x-b.minX)*scale),y:C.q((p.y-b.minY)*scale)}));if(!G.simple(pts))throw Error('SVG outline is self-intersecting or degenerate.');commit('Imported SVG outline',d=>{d.board.shape='polygon';d.board.points=pts;d.board.width=width;d.board.height=C.q((b.maxY-b.minY)*scale);});closeModal();S.selection=['board'];setPanel('board');refresh();renderer.fit();}}]);}

function finishDrawing(){if(!S.drawing)return;let pts=S.drawing.points.map(p=>({x:C.q(p.x),y:C.q(p.y)}));if(pts.length>1&&G.dist(pts[pts.length-1],pts[pts.length-2])<.001)pts.pop();if(S.tool==='trace'){if(pts.length>=2)finishManual(pts,null);return;}const tool=S.tool;if(tool==='silk-line'){if(pts.length<2)return;let a={id:C.uid('a'),kind:'line',x:0,y:0,points:pts.map(p=>({x:p.x*(S.side==='bottom'?-1:1),y:p.y})),width:.2,rotation:0,layer:S.side,mirror:false};commit('Drew silkscreen line',d=>d.art.push(a),{copper:false});S.selection=[a.id];S.drawing=null;S.tool='select';refresh();return;}

function help(){modal('Guide & keyboard shortcuts',`<div class="help-grid"><section><h3>Placement and routing</h3><p>Drag a representative part onto the board. Use its inspector to set value, position, side, and pin nets. R rotates. F moves a component to the opposite board face.</p><p>Choose <strong>Connect</strong>, click two or more leads, and select <strong>Preview wire</strong>. Routing is a cancellable, rule-aware proposal. Copper is added only when you choose <strong>Keep copper</strong>.</p><p><strong>Trace</strong> starts at a lead, via or existing trace. Click waypoints; click another lead, via or trace to finish. V inserts a through via and changes sides. The visible Via button also arms placement during tracing. Shift+V starts standalone via placement; choose the net and sizes in the inspector. Enter ends an open route.</p><p><strong>Planes</strong> assigns an electrical net to either copper face. Use Bottom ground · top routing for a simple starting point. Connect a lead previews direct contact or a short trace and via, then checks the actual filled copper. Keep connection commits the proposal. Existing pin nets never change implicitly.</p><p>Draw a board outline or change dimensions without resizing parts. Use Mark to convert a raster/SVG image into explicit silkscreen geometry.</p><p>Deleting copper leaves the net intact. Same-net copper is not necessarily connected: review split regions in the plane checks. New traces can split a pour.</p><p>Search or filter the Parts drawer, or open a catalog. Library tools contains block import, selection capture, block management, and KiCad footprint import.</p></section><section><h3>Files and fabrication</h3><p>Autosave uses this browser’s local storage. <strong>Save JSON</strong> makes a portable backup with footprints and image assets. Project ZIP wraps the same native data. No account, telemetry, CDN, or internet service is required.</p><p>Bench uses shaded 3D meshes. Copper removes the bodies. Fabrication parses actual generated Gerber/Excellon text.</p><p>Export files are not manufacturer-approved. Check all layers and the manufacturer preview. Generic package pin mapping and physical dimensions need your datasheet review.</p><p>Manufacturing uses exact footprint geometry, not the representative component body. Silkscreen is clipped at mask openings, holes, cutouts, and the board edge. Editor badges and host illustrations do not print. Check Top silk only and Bottom silk only in Fabrication.</p><p>The built-in reader supports the exporter’s subset, not every third-party Gerber dialect. Independent CAM review is still required.</p></section></div><div class="section-label">KEYBOARD</div><div class="table-wrap"><table><tbody>${[['V / Shift+V','Select (or insert via while tracing) / place standalone via'],['T / A','Trace / pick leads to connect'],['R / F','Rotate / flip selected component'],['X / G','X-ray / grid'],['S / L / O','Silkscreen text / line / mounting hole'],['B / Z','Outline / copper zone'],['Home','Fit board'],['Space + drag','Pan'],['Alt + drag','Orbit in Bench view'],['Wheel','Zoom at cursor'],['Shift','Disable snap while drawing; add to object selection'],['Enter / double-click','Finish shape or open route'],['Esc','Cancel placement, preview, or unfinished shape'],['⌘/Ctrl Z / Shift Z','Undo / redo'],['⌘/Ctrl S / O','Save JSON / open'],['Delete','Remove unlocked selection']].map(([a,b])=>`<tr><td><kbd>${a}</kbd></td><td>${b}</td></tr>`).join('')}</tbody></table></div><div class="section-label">LIMITATIONS</div><div class="notice">Two copper layers; through vias; circular, rectangular, and oval pads. Generic physical bodies are representative. Selected-net A* is not a push-and-shove router. Copper pours are conservative vectorized cell fills, not arbitrary exact boolean polygons. KiCad interchange is a documented subset; unsupported manufacturing features stop import. The read-back viewer is restricted to the generated Gerber/Excellon subset. No circuit simulation, impedance analysis, multilayer routing, or external 3D-model import.</div><p class="support-note">Geometry can be edited without an internet connection. A hosted service worker caches the static app; the portable HTML works directly from disk. Reports print through your browser’s Save as PDF dialog. See the included README and compatibility notes for the verification record.</p>`,[{label:'Close',primary:true,run:closeModal}],'COPPERBENCH / V'+C.VERSION);}

function blockPreview(canvas,t){const d=C.blank(),b=C.Blocks.bounds(t),w=b.maxX-b.minX+10,h=b.maxY-b.minY+10;d.board.width=w;d.board.height=h;const preview=C.Blocks.preview(t,5-b.minX,5-b.minY);for(const k of ['parts','traces','vias','nets'])d[k]=preview[k];const st={doc:d,view:'bench',side:'top',tilt:12,yaw:0,tool:'select',selection:[],selectedPads:[],theme:S.theme,showPlanes:true,grid:false,airwires:false};const rr=new C.Renderer(canvas,()=>st);rr.resize();rr.setup();rr.scale=Math.min((rr.w-50)/w,(rr.h-40)/(h*Math.cos(rr.tilt)+8*Math.sin(rr.tilt)));rr.panX=-20;rr.panY=0;rr.draw();}
function blockCatalog(chosen){

function readBlockDialog(){const t=C.clone(C.Blocks.get(S.doc,$('#blockChoice').value));$$('[data-block-value]').forEach(i=>t.parts[+i.dataset.blockValue].value=i.value);if(!$('#blockCopper').checked){t.traces=[];t.vias=[];}const mapping={};$$('[data-block-port]').forEach(i=>mapping[i.dataset.blockPort]=i.value);return{template:C.Blocks.validate(t),mapping,rotation:+$('#blockRotation').value,flip:$('#blockFlip').checked};}
function armBlock(data){setTool('select');S.blockPlacing=data;S.selection=[];S.selectedPads=[];S.view='bench';$('#drawer').classList.remove('open');refresh();}
function placeCircuit(data,x,y){const plan=C.Blocks.plan(S.doc,data.template,{x,y,rotation:data.rotation,flip:data.flip,mapping:data.mapping});if(!plan.ok)throw Error('Block placement blocked: '+plan.errors.slice(0,3).map(f=>f.message).join(' '));commit('Placed '+plan.record.label+' · '+plan.record.name,d=>{const staged=plan.document;Object.assign(d,staged);});S.blockPlacing=null;S.side=plan.document.parts.find(p=>p.id===plan.record.members[0])?.side||S.side;S.selection=[...plan.record.members];refresh();toast(plan.record.label+' placed. Ports use fresh scoped nets unless explicitly mapped.');return plan.record;}
function blockDetails(){const b=selectedBlock();if(!b){blockManager();return;}modal(b.label+' · '+b.name,`<p>${b.members.length} editable objects. Selecting one object edits it independently; select the whole block to move its copper with it.</p><div class="button-row"><button data-action="block-select">Select whole block</button><button data-action="block-copy">Copy with fresh nets</button><button data-action="block-export">Export block JSON</button></div><div class="form-grid"><label>Anchor X · mm<input id="blockMoveX" type="number" step="any" value="${b.x}"></label><label>Anchor Y · mm<input id="blockMoveY" type="number" step="any" value="${b.y}"></label><label>Additional rotation<select id="blockMoveRotation"><option>0</option><option>90</option><option>180</option><option>270</option></select></label><label class="checkbox-label"><input id="blockMoveFlip" type="checkbox">Flip across anchor</label></div><label class="checkbox-label"><input id="blockReviewed" type="checkbox" ${b.reviewed?'checked':''}>I reviewed values, interfaces and supply assumptions</label><div class="table-wrap"><table><thead><tr><th>Port</th><th>Project net</th></tr></thead><tbody>${b.ports.map(p=>`<tr><td>${E(p.name)}</td><td>${E(C.netName(S.doc,p.net))}</td></tr>`).join('')}</tbody></table></div><div class="notice">${b.notes.map(s=>'<p>'+E(s)+'</p>').join('')}<p>External board traces do not stretch when this block moves. Recheck connectivity. Copper remains ordinary geometry; saved blocks are not a schematic simulator.</p></div>`,[{label:'Close',run:closeModal},{label:'Detach grouping',run:()=>{commit('Detached circuit grouping',d=>C.Blocks.detach(d,b.id),{copper:false});closeModal();}},{label:'Apply block changes',primary:true,run:()=>{const x=+$('#blockMoveX').value,y=+$('#blockMoveY').value,rotation=+$('#blockMoveRotation').value,flip=$('#blockMoveFlip').checked,review=$('#blockReviewed').checked;commit('Edited circuit block',d=>{if(x!==b.x||y!==b.y||rotation||flip)C.Blocks.transform(d  S.hoverPad=hit?.type==='pad'?hit.id:null;let tip=$('#tooltip');if(hit?.type==='pad'&&!S.placing){tip.textContent=hit.object.ref+' · '+(hit.object.signal?hit.object.signal+' · ':'')+'Pin '+hit.object.pin+' · '+(hit.object.polarityLabel?hit.object.polarityLabel+' · ':'')+C.netName(S.doc,hit.object.net);tip.hidden=false;tip.style.left=Math.min(pos.x+15,Math.max(20,renderer.w-225))+'px';tip.style.top=Math.max(5,pos.y-34)+'px';}else if(hit?.type==='via'&&!S.placing){tip.textContent='Through via · '+C.netName(S.doc,hit.object.net)+' · '+hit.object.diameter+' / '+hit.object.drill+' mm';tip.hidden=false;tip.style.left=Math.min(pos.x+15,Math.max(20,renderer.w-225))+'px';tip.style.top=Math.max(5,pos.y-34)+'px';}else tip.hidden=true;renderer.request();
});
canvas.addEventListener('pointerup',e=>{if(touches.has(e.pointerId))touches.delete(e.pointerId);if(pinch){if(touches.size<2)pinch=null;S.drag=null;return;}let a=S.drag;S.drag=null;if(!a)return;try{if(['parts','object','vertex','block'].includes(a.mode)&&a.moved){if(a.object&&S.doc.vias.some(v=>v.id===a.object.id)){const r=C.V.propose(S.doc,a.object,a.object,a.object.id);if(!r.ok){S.doc=JSON.parse(a.before);refresh();throw Error(r.reason);}}commitDragged(a.before,'Moved '+(a.mode==='parts'?'component placement':a.mode==='vertex'?'geometry vertex':'object'));}
 else if(a.mode==='shape'){const b=S.cursor,box={x:Math.min(a.start.x,b.x),y:Math.min(a.start.y,b.y),w:Math.abs(b.x-a.start.x),h:Math.abs(b.y-a.start.y)};if(box.w<.1||box.h<.1){S.drawing=null;return;}if(a.tool.startsWith('outline')){let pts=a.tool==='outline-circle'?Array.from({length:128},(_,i)=>({x:box.x+box.w/2+Math.cos(i/128*2*Math.PI)*box.w/2,y:box.y+box.h/2+Math.sin(i/128*2*Math.PI)*box.h/2})):G.rect(box.x,box.y,box.w,box.h);applyOutline(pts);}else{let art={id:C.uid('a'),kind:a.tool==='silk-circle'?'circle':'rect',x:S.side==='bottom'?box.x+box.w:box.x,y:box.y,w:box.w,h:box.h,width:.2,layer:S.side,rotation:0,mirror:false};commit('Drew silkscreen shape',d=>d.art.push(art),{copper:false});S.selection=[art.id];S.drawing=null;S.tool='select';refresh();}}
 else if(a.mode==='marquee'&&S.marquee){let m=S.marquee,b=G.bounds([m.a,m.b]);S.selection=S.doc.parts.filter(p=>p.x>=b.minX&&p.x<=b.maxX&&p.y>=b.minY&&p.y<=b.maxY&&p.side===S.side).map(p=>p.id);S.marquee=null;refresh();}}catch(err){if(a.before)S.doc=JSON.parse(a.before);toast(err.message,true);refresh();}});
canvas.addEventListener('pointercancel',()=>{if(S.drag?.before)S.doc=JSON.parse(S.drag.before);S.drag=null;touches.clear();pinch=null;renderer.request();});
canvas.addEventListener('pointerleave',()=>{if(!S.drag){S.hoverPad=null;$('#tooltip').hidden=true;S.cursor=null;renderer.request();}});
canvas.addEventListener('dblclick',e=>{e.preventDefault();if(S.drawing)try{finishDrawing();}catch(err){toast(err.message,true);}});
canvas.addEventListener('wheel',e=>{e.preventDefault();let p=canvasPoint(e);renderer.zoom(Math.exp(-e.deltaY*.0012),p.x,p.y);},{passive:false});
canvas.addEventListener('contextmenu',e=>{e.preventDefault();let p=canvasPoint(e),hit=renderer.hit(p.x,p.y);if(hit){select(hit.type==='pad'?hit.object.partId:hit.id);modal('Work on this selection.',`${hit.type==='pad'?'<button class="wide-button primary" data-plane-pin="'+E(hit.id)+'">Connect this lead to a plane</button>':''}<div class="button-row"><button data-action="rotate">Rotate 90°</button><button data-action="flip">Flip part side</button><button data-action="duplicate">Duplicate</button></div><div class="button-row"><button data-action="lock">Lock / unlock</button><button data-action="delete" class="danger">Delete</button></div><p class="support-note">Changes are undoable. Locked geometry stays protected.</p>`,[{label:'Close',run:closeModal}]);}});
document.addEventListener('dragstart',e=>{let card=e.target.closest('[data-place]');if(card){e.dataTransfer.setData('application/x-copperbench-part',card.dataset.place);e.dataTransfer.effectAllowed='copy';}});
stage.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='copy';});stage.addEventListener('drop',e=>{e.preventDefault();let id=e.dataTransfer.getData('application/x-copperbench-part');if(id){let pos=canvasPoint(e),p=snap(renderer.unproject(pos.x,pos.y)),part=C.makePart(S.doc,id,p.x,p.y);part.side=part.defaultSide||S.side;commit('Dropped '+part.ref+' onto board',d=>d.parts.push(part));S.placing=null;S.selection=[part.id];refresh();}else if(e.dataTransfer.files.length)importFile(e.dataTransfer.files[0]).catch(err=>toast(err.message,true));});
window.addEventListener('keydown',e=>{if($('#modal').open)return;if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(['Enter',' '].includes(e.key)&&e.target.closest?.('button,a,summary,[role=button]'))return;const mod=e.ctrlKey||e.metaKey,key=e.key.toLowerCase();if(S.blockPlacing&&['r','f'].includes(key)&&!mod){e.preventDefault();if(key==='r')S.blockPlacing.rotation=(S.blockPlacing.rotation+90)%360;else S.blockPlacing.flip=!S.blockPlacing.flip;renderer.request();return;}if(mod&&key==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}if(mod&&key==='y'){e.preventDefault();redo();return;}if(mod&&key==='s'){e.preventDefault();actions.save();return;}if(mod&&key==='o'){e.preventDefault();actions.open();return;}if(e.key===' '){spaceDown=true;e.preventDefault();return;}if(e.key==='Escape'){cancelDrawing();S.tool='select';S.selectedPads=[];refresh();return;}if(e.key==='Enter'){e.preventDefault();try{finishDrawing();}catch(err){toast(err.message,true);}return;}if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();removeSelection();return;}if(e.key==='Home'){e.preventDefault();renderer.fit();return;}if(key==='r'){actions.rotate();return;}if(key==='f'){actions.flip();return;}if(key==='x'){actions.xray();return;}if(key==='g'){actions.grid();return;}if(key==='h'){help();return;}if(key==='d'){runChecks(true);return;}if(key==='v'&&S.drawing&&S.tool==='trace'){e.preventDefault();insertVia();return;}if(key==='v'&&e.shiftKey){e.preventDefault();setTool('via');return;}const tools={v:'select',t:'trace',a:'connect',o:'hole',z:'zone',b:'outline',s:'text',l:'silk-line'};if(tools[key])setTool(tools[key]);if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&S.selection.length){e.preventDefault();const delta=S.doc.settings.grid*(e.shiftKey?10:1),dx=e.key==='ArrowLeft'?-delta:e.key==='ArrowRight'?delta:0,dy=e.key==='ArrowUp'?-delta:e.key==='ArrowDown'?delta:0;try{commit('Nudged selection',d=>{const b=wholeBlockSelected();if(b){C.Blocks.transform(d,b.id,{x:b.x+dx,y:b.y+dy});return;}for(const p of [...d.parts,...d.art,...d.holes,...d.vias])if(S.selection.includes(p.id)&&!p.locked){if(d.vias.includes(p))C.V.edit(d,p.id,{x:C.q(p.x+dx),y:C.q(p.y+dy)});else{p.x=C.q(p.x+dx);p.y=C.q(p.y+dy);}}});}catch(e){/* commit restores the board and displays the rule violation. */}}});
window.addEventListener('keyup',e=>{if(e.key===' ')spaceDown=false;});window.addEventListener('blur',()=>spaceDown=false);
window.addEventListener('beforeunload',()=>{if($('#saveState').classList.contains('dirty'))persist();});
let compact=innerWidth<950;window.addEventListener('resize',()=>{const next=innerWidth<950;if(next&&!compact){$('#inspector').classList.add('collapsed');$('#drawer').classList.remove('open');renderer.fit();}compact=next;});
const observer=new ResizeObserver(()=>renderer.request());observer.observe(stage);
$('#blockInput').addEventListener('change',e=>{importBlockFile(e.target.files[0]).catch(err=>toast('Block import: '+err.message,true));e.target.value='';});
function boot(){hydrateLibrary();S.units=prefs.units||'mm';document.documentElement.dataset.theme=S.theme;if(window.innerWidth<950||prefs.inspector===false)$('#inspector').classList.add('collapsed');markSave('',stored?'Saved locally':'Sample · not saved');refresh();renderer.fit();scheduleChecks();if(startupError){markSave('failed','Save JSON · storage unavailable');toast(startupError,true);}if(!window.CB_PORTABLE&&location.protocol!=='file:'&&'serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{$('#statusMessage').textContent='App is usable; offline installation is unavailable in this browser context.';});window.CBAPP.ready=true;}
boot();
